server.port=8080

# 本地文件型 H2（本地持久化，重启后数据保留）
spring.datasource.url=jdbc:h2:file:./data/auditdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 审计数据保留策略（天）：导出时超过保留期的数据不得带出
app.retention.retention-days=90
# 事件时间允许的未来偏移（分钟），超出视为时间异常
app.retention.max-clock-skew-minutes=5
